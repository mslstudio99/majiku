name: majiku
description: "Majiku — Proyek Flutter dengan integrasi Firestore dan Audio Timeline."
publish_to: 'none' 

# [MODIFIKASI] Versi dinaikkan untuk update rilis Play Store
version: 2.1.4+26

environment:
  sdk: '>=3.2.6 <4.0.0'

# No ke-1: KELOMPOK DEPENDENCIES UTAMA #
#......................................................#
dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.4.10
  cloud_functions: ^5.6.2
  firebase_app_check: ^0.3.2+10

  flutter_riverpod: ^2.5.1
  in_app_purchase: ^3.2.0

  audioplayers: ^6.0.0      
  video_player: ^2.8.6      
  url_launcher: ^6.3.0      
  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.0.3 
  image_picker: ^1.2.1

  file_picker: ^8.0.5       
  path_provider: ^2.1.3     
  http: ^1.2.1              
  intl: ^0.20.2
  gal: ^2.3.0 # ✅ SOLUSI FINAL ANDROID: Package modern tanpa error Gradle

  device_info_plus: ^10.1.0    
  shared_preferences: ^2.2.3   
  uuid: ^4.5.3                 
  android_id: ^0.5.1
  universal_html: ^2.3.0
  
  # [TAMBAHAN BARU] Wajib untuk membaca versi aplikasi saat ini (Force Update)
  package_info_plus: ^8.0.0
#......................................................#

# No ke-2: KELOMPOK DEV DEPENDENCIES & KONFIGURASI #
#......................................................#
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/
    - assets/tombol-dashboard/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
#......................................................#