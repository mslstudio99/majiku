name: majiku
description: "Majiku — Proyek Flutter dengan integrasi Firestore dan Audio Timeline."
publish_to: 'none' # Private project (tidak dipublikasikan ke pub.dev)

version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ------------------------------------------------------------
  # 🔥 Firebase Core & Services
  # ------------------------------------------------------------
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  # google_sign_in: ^6.2.1  <-- DIHAPUS (Tidak digunakan lagi)
  cloud_firestore: ^5.0.1

  # ------------------------------------------------------------
  # ⚙️ State Management
  # ------------------------------------------------------------
  flutter_riverpod: ^2.5.1

  # ------------------------------------------------------------
  # 🎧 Audio, Media, dan UI
  # ------------------------------------------------------------
  audioplayers: ^6.0.0      # ✅ Digunakan oleh alur IMAGEN (Tetap)
  video_player: ^2.8.6      # <-- KATEGORI_PENYESUAIAN_VEO: Dibutuhkan oleh alur VEO
  
  # --- [PERBAIKAN THUMBNAIL] ---
  # video_thumbnail: ^0.5.3 # <-- DIHAPUS (Tidak support Flutter Web)
  # --- [AKHIR PERBAIKAN] ---
  
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.0.3 # <-- Ditambahkan di sini

  # ------------------------------------------------------------
  # 📁 File, Path, & Network Utils
  # ------------------------------------------------------------
  file_picker: ^8.0.5       # Untuk dialog simpan file
  path_provider: ^2.1.3     # Untuk direktori lokal
  http: ^1.2.1              # Untuk unduhan file & API eksternal
  firebase_storage: ^12.4.10
  cloud_functions: ^5.6.2
  intl: ^0.20.2

  # ------------------------------------------------------------
  # 💬 Animasi & UI Ekstra (opsional, jika kamu pakai di widget)
  # ------------------------------------------------------------
  # lottie: ^3.1.0
  # animations: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Tambahkan library untuk generate icon:
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/
    # Pastikan Anda memiliki gambar master icon di sini:
    # - assets/icon/icon.png 

# ------------------------------------------------------------
# 🎨 Konfigurasi Icon Launcher (Otomatis)
# ------------------------------------------------------------
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png" # Pastikan file gambar master ada di folder ini
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#ffffff" # Ganti jika ingin background selain putih
    theme_color: "#ffffff"