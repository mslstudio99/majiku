name: majiku
description: "Majiku — Proyek Flutter dengan integrasi Firestore dan Audio Timeline."
publish_to: 'none' 

# [MODIFIKASI] Versi dinaikkan untuk update rilis Play Store & penimpaan track lama
version: 4.2.18+50

environment:
  sdk: '>=3.2.6 <4.0.0'

#No ke-1: KELOMPOK DEPENDENCIES UTAMA................................................................#
#Sub-judul: Memuat seluruh library utama termasuk integrasi Google Play Billing Library v8.0.0+......#
dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.4.10
  cloud_functions: ^5.6.2
  firebase_app_check: ^0.3.2+10

  flutter_riverpod: ^2.5.1
  
  # [PERBAIKAN BUG: GOOGLE PLAY BILLING v8/v9 COMPLIANCE] 
  # Versi ini mengimplementasikan Google Play Billing Library 8.0.0+ secara resmi
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2

  audioplayers: ^6.0.0      
  video_player: ^2.8.6      
  url_launcher: ^6.3.0      
  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.0.3 
  image_picker: ^1.2.1

  file_picker: ^8.0.5        
  path_provider: ^2.1.3      
  http: ^1.2.1              
  intl: ^0.20.2
  gal: ^2.3.0 # ✅ SOLUSI FINAL ANDROID: Package modern tanpa error Gradle

  device_info_plus: ^10.1.0    
  shared_preferences: ^2.2.3   
  uuid: ^4.5.3                 
  android_id: ^0.5.1
  universal_html: ^2.3.0
  
  # [TAMBAHAN BARU] Wajib untuk membaca versi aplikasi saat ini (Force Update)
  package_info_plus: ^8.0.0

  # [BARU: GOOGLE ADMOB & TIPOGRAFI DAILY QUOTES]
  google_mobile_ads: ^5.1.0
  google_fonts: ^6.2.1
#Akhir Blok 1........................................................................................#

#No ke-2: KELOMPOK DEV DEPENDENCIES & KONFIGURASI....................................................#
#Sub-judul: Konfigurasi build, testing, dan aset aplikasi............................................#
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/
    - assets/tombol-dashboard/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
#Akhir Blok 2........................................................................................#